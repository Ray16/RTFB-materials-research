  <g id="text_25">
   <text style="font-weight: 700; font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: middle" x="421.2" y="19.3575" transform="rotate(-0 421.2 19.3575)">Quantifying nearby-site interaction strength</text>
  </g>
  <g id="text_26">
   <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start" x="7.2" y="54.72" transform="rotate(-0 7.2 54.72)">17/27 DFT cases checked · MeCN · no interaction ΔG or electron-transfer rates</text>
  </g>
  <g id="text_27">
   <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start" x="7.2" y="387.36" transform="rotate(-0 7.2 387.36)">Stacked contacts occur for 3/3 dimer controls. Geometry alone does not quantify interaction strength.</text>
  </g>
  <g id="text_28">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start" x="7.2" y="420.624" transform="rotate(-0 7.2 420.624)">Association includes backbone/cap contacts and deformation; covalent folding includes conformational effects. BSSE and entropy remain unqualified.</text>
  </g>
  <g id="text_29">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start" x="7.2" y="444.384" transform="rotate(-0 7.2 444.384)">These deterministic structure comparisons have no quantified error bars. Geometry and electronic ΔE do not establish equilibrium populations or transfer rates.</text>
  </g>
