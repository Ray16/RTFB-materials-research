name: CPU interface and cached replay checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'pytest>=7,<9'
      - name: Standard-library interfaces and cached arithmetic
        env:
          PYTHONPATH: src
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          python -m redox --help
          python -m redox workflows --json
          python -I -S examples/cached_thermochemistry/reproduce.py
          python -m pytest -q tests/test_cached_thermochemistry.py tests/test_workflow_catalog.py tests/test_config_loading.py tests/test_workspace_index.py tests/test_reviewer_collection_paths.py tests/test_release_gate.py
